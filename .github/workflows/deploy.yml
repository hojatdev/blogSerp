name: Deploy Theme via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy theme via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2277 -H $SSH_HOST >> ~/.ssh/known_hosts
          rsync -avz --delete \
            -e "ssh -p 2277 -i ~/.ssh/id_ed25519" \
            ./wp-content/themes/serpvision/ \
            root@$SSH_HOST:/home/serpvision/web/blog.serpvision.net/public_html/wp-content/themes/serpvision/
