name: Deploy Theme via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy theme via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "set ftp:ssl-allow no" > /tmp/deploy.lftp
          echo "set ftp:passive-mode yes" >> /tmp/deploy.lftp
          echo "set net:timeout 30" >> /tmp/deploy.lftp
          echo "set net:max-retries 2" >> /tmp/deploy.lftp
          printf "open -u %s,%s ftp://%s\n" "$FTP_USERNAME" "$FTP_PASSWORD" "$FTP_SERVER" >> /tmp/deploy.lftp
          echo "mirror -R --verbose ./wp-content/themes/serpvision/ wp-content/themes/serpvision/" >> /tmp/deploy.lftp
          echo "bye" >> /tmp/deploy.lftp
          lftp -d -f /tmp/deploy.lftp
          rm -f /tmp/deploy.lftp
